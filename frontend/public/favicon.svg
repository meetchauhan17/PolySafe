<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Cyan Gradient -->
    <linearGradient id="fav-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#0369A1" />
    </linearGradient>

    <!-- Warm Coral Gradient -->
    <linearGradient id="fav-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF5C35" />
      <stop offset="100%" stopColor="#E04823" />
    </linearGradient>

    <!-- Modern Shield Ambient Gradient -->
    <linearGradient id="fav-shield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F4EFEA" />
    </linearGradient>
  </defs>

  <!-- 1. Aerodynamic Clinical Shield Contour -->
  <path
    d="M 32 5 C 44.5 5, 54.5 8.2, 55 15.5 C 55 38.5, 45 51.5, 32 58.5 C 19 51.5, 9 38.5, 9 15.5 C 9.5 8.2, 19.5 5, 32 5 Z"
    fill="url(#fav-shield)"
    stroke="#16212C"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- 2. Minimalist Precision Bi-Chamber Capsule (45 deg Angle) -->
  <g transform="translate(32, 32) rotate(-45)">
    <!-- Top Chamber (Cyan/Teal: Clinical Formulation) -->
    <path
      d="M -8.5 -2.2 L -8.5 -9.5 C -8.5 -14.19 -4.69 -18 0 -18 C 4.69 -18 8.5 -14.19 8.5 -9.5 L 8.5 -2.2 Z"
      fill="url(#fav-brand)"
      stroke="#16212C"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Clinical Cross in Top Chamber -->
    <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-12.5" x2="0" y2="-6.5" />
      <line x1="-3" y1="-9.5" x2="3" y2="-9.5" />
    </g>

    <!-- Bottom Chamber (Warm Coral: Interaction Sentinel) -->
    <path
      d="M -8.5 2.2 L 8.5 2.2 L 8.5 9.5 C 8.5 14.19 4.69 18 0 18 C -4.69 18 -8.5 14.19 -8.5 9.5 Z"
      fill="url(#fav-coral)"
      stroke="#16212C"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Surveillance Core Dot in Bottom Chamber -->
    <circle cx="0" cy="9.5" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- 3. Real-Time Pharmacovigilance Radar Pulse Beacon -->
  <g transform="translate(45, 17)">
    <circle r="4.5" fill="none" stroke="#FF5C35" stroke-width="1" opacity="0.4" />
    <circle r="2.2" fill="#FF5C35" stroke="#16212C" stroke-width="0.8" />
  </g>
</svg>