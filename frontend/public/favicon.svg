<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Sapphire Gradient (Vertical Capsule) -->
    <linearGradient id="sc-brand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Warm Coral Gradient (Horizontal Capsule) -->
    <linearGradient id="sc-coral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C35" />
      <stop offset="100%" stop-color="#E04823" />
    </linearGradient>

    <!-- Ambient Elevation Drop Shadow -->
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="rgba(14, 116, 144, 0.22)" />
    </filter>
  </defs>

  <g filter="url(#sc-shadow)">
    <!-- Vertical Capsule (Brand Sapphire: Clinical Precision & Formulation) -->
    <rect x="23" y="8" width="18" height="48" rx="9" fill="url(#sc-brand)" />

    <!-- Horizontal Capsule Negative-Space Mask / Gap -->
    <rect x="5.5" y="20.5" width="53" height="23" rx="11.5" fill="none" stroke="#FFFFFF" stroke-width="3.5" />

    <!-- Horizontal Capsule (Warm Coral: Interaction Sentinel & Polypharmacy Surveillance) -->
    <rect x="8" y="23" width="48" height="18" rx="9" fill="url(#sc-coral)" />

    <!-- Clinical Intersection Heart Dot (Luminous Core Beacon) -->
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>